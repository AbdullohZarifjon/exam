dev: ${DEV:true}
server:
  port: ${SERVER_PORT:8080}
  http2:
    enabled: true
spring:
  threads:
    virtual:
      enabled: true
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/examine}
jwt:
  secret: ${JWT_SECRET:dev-secret-change-in-production-at-least-32-chars-long}
  access-token-validity: ${JWT_ACCESS_VALIDITY:900}
  refresh-token-validity: ${JWT_REFRESH_VALIDITY:2592000}
cookie:
  secured: ${COOKIE_SECURED:false}
storage:
  endpoint: ${S3_ENDPOINT:https://s3.sardorkhurramov.uz:9001}
  bucket: ${S3_BUCKET:zarif-aka}
  access-key: ${S3_ACCESS_KEY:admin}
  secret-key: ${S3_SECRET_KEY:maxfiy-parol}
  region: ${S3_REGION:us-east-1}
  presigned-url-expiration: ${STORAGE_PRESIGNED_URL_EXPIRATION:900}
face-service:
  base-url: ${FACE_SERVICE_URL:http://localhost:8000}
  match-threshold: ${FACE_MATCH_THRESHOLD:0.60}
  gap-threshold: ${FACE_GAP_THRESHOLD:0.08}
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    allowed-methods: "*"
    allowed-headers: "*"
    allow-credentials: true
admin:
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD:admin123}
  full-name: ${ADMIN_FULL_NAME:Administrator}
seed:
  teacher:
    username: ${SEED_TEACHER_USERNAME:teacher}
    password: ${SEED_TEACHER_PASSWORD:teacher123}
    full-name: ${SEED_TEACHER_FULL_NAME:Teacher}
  student:
    full-name: ${SEED_STUDENT_FULL_NAME:Test Student}
    code: ${SEED_STUDENT_CODE:STU-2026-1}
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
