services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      - FACE_SERVICE_URL=http://face-service:8000
      - MONGODB_URI=mongodb://mongo:27017/exam_db
    depends_on:
      - mongo
      - face-service
  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - ./data:/data/db
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - ./minio-data:/data
  face-service:
    build: ./face-service
    ports:
      - "8000:8000"
    environment:
      FACE_MODEL: buffalo_s
      FACE_MATCH_THRESHOLD: 0.60
      FACE_GAP_THRESHOLD: 0.08
    volumes:
      - ./face-data:/data
